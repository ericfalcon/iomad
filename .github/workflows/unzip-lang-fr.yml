name: Unzip French Iomad language pack

on:
  workflow_dispatch:

jobs:
  unzip-lang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip language archive
        run: |
          mkdir -p /tmp/langzip
          unzip iomad-fr.zip -d /tmp/langzip

          # Cas 1 : le zip contient déjà "fr" ou "fr_local"
          if [ -d "/tmp/langzip/fr" ]; then
            mkdir -p lang/fr_local
            cp -r /tmp/langzip/fr/* lang/fr_local/
          fi

          if [ -d "/tmp/langzip/fr_local" ]; then
            mkdir -p lang/fr_local
            cp -r /tmp/langzip/fr_local/* lang/fr_local/
          fi

          # Cas 2 : le zip contient "lang/fr"
          if [ -d "/tmp/langzip/lang/fr" ]; then
            mkdir -p lang/fr_local
            cp -r /tmp/langzip/lang/fr/* lang/fr_local/
          fi

          echo "✅ Langue française installée dans lang/fr_local"

      - name: Remove zip
        run: rm -f iomad-fr.zip

      - name: Commit language files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lang/fr_local
          git commit -m "Ajout traduction française Iomad (fr_local)"
          git push
