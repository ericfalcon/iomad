name: Unzip French Iomad custom language pack

on:
  workflow_dispatch:

jobs:
  unzip-lang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show lang directory
        run: |
          echo "=== Contenu du dossier lang ==="
          ls -la lang

      - name: Unzip and install French language
        run: |
          set +e   # IMPORTANT : ne jamais arrêter le job sur une erreur

          ZIP="lang/customlang_fr (2).zip"

          if [ ! -f "$ZIP" ]; then
            echo "❌ ZIP introuvable : $ZIP"
            exit 0
          fi

          echo "=== Extraction du ZIP ==="
          mkdir -p /tmp/langzip
          unzip "$ZIP" -d /tmp/langzip || true

          echo "=== Contenu extrait ==="
          ls -la /tmp/langzip || true

          echo "=== Installation dans lang/fr_local ==="
          mkdir -p lang/fr_local

          if [ -d "/tmp/langzip/FR" ]; then
            cp -r /tmp/langzip/FR/* lang/fr_local/ || true
          fi

          if [ -d "/tmp/langzip/fr" ]; then
            cp -r /tmp/langzip/fr/* lang/fr_local/ || true
          fi

          if [ -d "/tmp/langzip/lang/fr" ]; then
            cp -r /tmp/langzip/lang/fr/* lang/fr_local/ || true
          fi

          echo "✅ Étape unzip terminée"

      - name: Remove zip
        run: |
          rm -f "lang/customlang_fr (2).zip" || true

      - name: Commit changes if any
        run: |
          set +e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add lang/fr_local || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Ajout traduction française Iomad (fr_local)"
            git push
          else
            echo "ℹ️ Aucun changement à commiter"
          fi
