name: Unzip French Iomad custom language pack

on:
  workflow_dispatch:

jobs:
  unzip-lang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show lang directory
        run: |
          echo "=== Contenu du dossier lang AVANT ==="
          ls -la lang

      - name: Unzip and install French language
        run: |
          set +e

          ZIP="lang/customlang_fr (2).zip"

          if [ ! -f "$ZIP" ]; then
            echo "❌ ZIP introuvable : $ZIP"
            exit 0
          fi

          echo "=== Extraction du ZIP ==="
          mkdir -p /tmp/langzip
          unzip "$ZIP" -d /tmp/langzip || true

          echo "=== Contenu extrait ==="
          ls -la /tmp/langzip || true

          echo "=== Installation dans lang/fr_local ==="
          mkdir -p lang/fr_local

          # Le ZIP contient directement les fichiers .php
          cp -r /tmp/langzip/*.php lang/fr_local/ || true

          echo "✅ Fichiers copiés dans lang/fr_local"

      - name: Remove zip
        run: |
          rm -f "lang/customlang_fr (2).zip" || true

      - name: Commit changes (force add, Moodle gitignore)
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # FORCE l'ajout malgré .gitignore
          git add -f lang/fr_local || true
          git add -f lang/customlang_fr\ \(2\).zip || true

          git status --porcelain

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Ajout traduction française Iomad (fr_local)"
            git push
          else
            echo "ℹ️ Aucun changement à commiter"
          fi

      - name: Show lang directory after
        run: |
          echo "=== Contenu du dossier lang APRES ==="
          ls -la lang
