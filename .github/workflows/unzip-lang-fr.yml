name: Unzip French Iomad custom language pack

on:
  workflow_dispatch:

jobs:
  unzip-lang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip French custom language from /lang
        run: |
          mkdir -p /tmp/langzip
          unzip "lang/customlang_fr(2).zip" -d /tmp/langzip

          # Cas 1 : le zip contient fr ou fr_local
          if [ -d "/tmp/langzip/fr" ]; then
            mkdir -p lang/fr_local
            cp -r /tmp/langzip/fr/* lang/fr_local/
          fi

          if [ -d "/tmp/langzip/fr_local" ]; then
            mkdir -p lang/fr_local
            cp -r /tmp/langzip/fr_local/* lang/fr_local/
          fi

          # Cas 2 : le zip contient lang/fr
          if [ -d "/tmp/langzip/lang/fr" ]; then
            mkdir -p lang/fr_local
            cp -r /tmp/langzip/lang/fr/* lang/fr_local/
          fi

          echo "✅ Traduction française personnalisée installée dans lang/fr_local"

      - name: Remove zip file
        run: rm -f "lang/customlang_fr(2).zip"

      - name: Commit French language files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lang/fr_local
          git commit -m "Ajout traduction française Iomad (custom fr_local)"
          git push
