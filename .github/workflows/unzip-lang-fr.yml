name: Unzip French Iomad custom language pack

on:
  workflow_dispatch:

jobs:
  unzip-lang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show lang directory
        run: |
          echo "Contenu de lang/"
          ls -la lang

      - name: Show ZIP content
        run: |
          unzip -l "lang/customlang_fr (2).zip"

      - name: Unzip and install French language
        run: |
          ZIP="lang/customlang_fr (2).zip"

          if [ ! -f "$ZIP" ]; then
            echo "Fichier ZIP introuvable"
            exit 1
          fi

          mkdir -p /tmp/langzip
          unzip -o "$ZIP" -d /tmp/langzip

          mkdir -p lang/fr_local

          # cas FR (majuscule)
          if [ -d "/tmp/langzip/FR" ]; then
            cp -r /tmp/langzip/FR/* lang/fr_local/
          fi

          # autres cas au besoin
          if [ -d "/tmp/langzip/fr" ]; then
            cp -r /tmp/langzip/fr/* lang/fr_local/
          fi

          if [ -d "/tmp/langzip/lang/fr" ]; then
            cp -r /tmp/langzip/lang/fr/* lang/fr_local/
          fi

      - name: Remove zip
        run: rm -f "lang/customlang_fr (2).zip"

      - name: Commit changes if any
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add lang/fr_local || true

          git status --porcelain

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Ajout traduction française Iomad (fr_local)"
            git push
          else
            echo "Aucun changement à commiter"
          fi
